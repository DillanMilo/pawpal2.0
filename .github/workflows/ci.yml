name: PawPal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint & Test ────────────────────────────────────────────────
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Create analyzer .env
        run: cp .env.example .env

      - name: Run analyzer (allow infos)
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  # ── Build Android APK ─────────────────────────────────────────
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create .env from secret
        run: echo "${{ secrets.DOTENV_FILE }}" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned release APK for verification
        env:
          # This artifact verifies the release configuration but is not suitable
          # for Play Console upload. Store releases must use key.properties.
          PAWPAL_ALLOW_UNSIGNED_RELEASE: "true"
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawpal-ci-unsigned-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ── Build iOS (no codesign) ───────────────────────────────────
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create .env from secret
        run: echo "${{ secrets.DOTENV_FILE }}" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Verify bundled production backend
        run: ./scripts/verify_ios_release_artifact.sh build/ios/iphoneos/Runner.app
