name: pawpal
description: "PawPal - Your all-in-one pet management companion"
publish_to: 'none'

version: 1.0.0+13

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.3.0

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^14.0.0

  # UI Components
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  fl_chart: ^0.66.2
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.0.0

  # Date/Time
  table_calendar: ^3.0.9
  intl: ^0.20.0

  # Image handling
  image_picker: ^1.0.7

  # QR Code
  pretty_qr_code: ^3.3.0
  mobile_scanner: ^6.0.0

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Maps
  google_maps_flutter: ^2.5.3

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2
  archive: ^3.6.1

  # Notifications
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  # URL Launcher
  url_launcher: ^6.2.4

  # Share functionality
  share_plus: ^10.0.0

  # UUID generation
  uuid: ^4.3.3

  # Connectivity
  connectivity_plus: ^6.1.0

  # Environment configuration
  flutter_dotenv: ^5.1.0

  # HTTP requests
  http: ^1.2.0

  # Cross-platform subscription entitlements (App Store, Play, Stripe web)
  purchases_flutter: ^10.4.2

  # JSON serialization
  json_annotation: ^4.8.1

  # Loading indicators
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/auth/
    - assets/icons/
