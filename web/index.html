<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="PawPal - Your all-in-one pet management companion">
  <meta name="theme-color" content="#9D7BEA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PawPal">

  <link rel="manifest" href="manifest.json">
  <title>PawPal</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #FBFAFE;
    }
    #pawpal-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #FBFAFE;
      transition: opacity 0.4s ease;
      z-index: 9999;
    }
    #pawpal-loader .paw {
      font-size: 56px;
      animation: pawpal-bounce 1.1s ease-in-out infinite;
    }
    #pawpal-loader .name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: #171717;
      letter-spacing: -0.5px;
    }
    #pawpal-loader .bar {
      width: 120px;
      height: 5px;
      border-radius: 999px;
      background: #EFE7FF;
      overflow: hidden;
    }
    #pawpal-loader .bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #9D7BEA;
      animation: pawpal-slide 1.2s ease-in-out infinite;
    }
    @keyframes pawpal-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pawpal-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @media (prefers-color-scheme: dark) {
      html, body, #pawpal-loader { background: #121212; }
      #pawpal-loader .name { color: #F1F1F3; }
      #pawpal-loader .bar { background: #2E2E42; }
    }
  </style>
</head>
<body>
  <div id="pawpal-loader" aria-label="Loading PawPal">
    <div class="paw">🐾</div>
    <div class="name">PawPal</div>
    <div class="bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('pawpal-loader');
      if (!loader) return;
      loader.style.opacity = '0';
      setTimeout(function () { loader.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
